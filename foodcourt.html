<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>가상 음식점</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
      padding-bottom: 140px;
    }

    .title {
      text-align: center;
      margin-bottom: 60px;
    }

    .title h1 {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .menu-section {
      margin-bottom: 70px;
    }

    .menu-title {
      font-size: 30px;
      margin-bottom: 25px;
      border-left: 5px solid #2563eb;
      padding-left: 12px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-body {
      padding: 18px;
    }

    .food-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .price {
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .order-btn {
      width: 100%;
      border: none;
      background: #0f172a;
      color: white;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .order-btn:hover {
      background: #1e293b;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.08);
    }

    .checkout-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    <h1>JAEMIN'S Virtual Restaurant</h1>
    <p>Korean · Chinese · Western · Japanese Food</p>
  </div>

  <!-- 한식 -->
  <div class="menu-section">
    <div class="menu-title">Korean Menu</div>

    <div class="grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1553163147-622ab57be1c7?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">비빔밥</div>
          <div class="price">₩ 10,000</div>
          <button class="order-btn" onclick="addPrice(10000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">냉면</div>
          <div class="price">₩ 9,000</div>
          <button class="order-btn" onclick="addPrice(9000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1603360946369-dc9bb6258143?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">순대국밥</div>
          <div class="price">₩ 8,000</div>
          <button class="order-btn" onclick="addPrice(8000)">주문하기</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 중식 -->
  <div class="menu-section">
    <div class="menu-title">Chinese Menu</div>

    <div class="grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1585032226651-759b368d7246?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">짜장면</div>
          <div class="price">₩ 7,000</div>
          <button class="order-btn" onclick="addPrice(7000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1617093727343-374698b1b08d?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">짬뽕</div>
          <div class="price">₩ 8,000</div>
          <button class="order-btn" onclick="addPrice(8000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1604909052743-94e838986d24?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">탕수육</div>
          <div class="price">₩ 15,000</div>
          <button class="order-btn" onclick="addPrice(15000)">주문하기</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 양식 -->
  <div class="menu-section">
    <div class="menu-title">Western Menu</div>

    <div class="grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1562967916-eb82221dfb92?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">치킨</div>
          <div class="price">₩ 20,000</div>
          <button class="order-btn" onclick="addPrice(20000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">피자</div>
          <div class="price">₩ 18,000</div>
          <button class="order-btn" onclick="addPrice(18000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">햄버거</div>
          <div class="price">₩ 7,000</div>
          <button class="order-btn" onclick="addPrice(7000)">주문하기</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 일식 -->
  <div class="menu-section">
    <div class="menu-title">Japanese Menu</div>

    <div class="grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">초밥</div>
          <div class="price">₩ 15,000</div>
          <button class="order-btn" onclick="addPrice(15000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1618841557871-b4664fbf0cb3?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">우동</div>
          <div class="price">₩ 8,000</div>
          <button class="order-btn" onclick="addPrice(8000)">주문하기</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1607330289024-1535c6b4e1c1?q=80&w=1200&auto=format&fit=crop">
        <div class="card-body">
          <div class="food-name">규동</div>
          <div class="price">₩ 9,000</div>
          <button class="order-btn" onclick="addPrice(9000)">주문하기</button>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- 하단 결제 -->
<div class="footer">
  <div>
    <div>총 주문 금액</div>
    <h2 id="total">₩ 0</h2>
  </div>

  <button class="checkout-btn" onclick="checkout()">
    결제하기
  </button>
</div>

<script>

  let total = 0;

  function addPrice(price) {
    total += price;

    document.getElementById("total").innerText =
      "₩ " + total.toLocaleString();
  }

  function checkout() {

    if(total === 0) {
      alert("주문한 내역이 없습니다.");
      return;
    }

    alert("총 " + total.toLocaleString() + "원 결제가 완료되었습니다!");

    total = 0;

    document.getElementById("total").innerText = "₩ 0";
  }

</script>

</body>
</html>
